<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنه يراني | قراري الرقمي</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#0f2771;background:#f4f7fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#dceefb 0,transparent 40%),radial-gradient(ellipse at 5% 95%,#f4e5f4 0,transparent 38%),#f5f8fc}

p{line-height:2;color:#475779;font-size:16px}
article>p{text-align:center}
button{display:block;width:100%;margin:14px 0;padding:18px 20px;border:2px solid #e3eaf5;border-radius:16px;background:#f9fbff;color:#0f2771;font:inherit;font-size:16px;cursor:pointer;text-align:right;transition:transform .15s,border-color .15s,box-shadow .15s}

button.primary{background:linear-gradient(110deg,#004d9f,#0f2771);border-color:transparent;color:white;text-align:center;font-weight:bold;box-shadow:0 9px 24px #004d9f30}
button:disabled{opacity:.7;cursor:default}
.good,.bad{padding:19px 22px;border-radius:16px;margin-top:20px;line-height:1.8}
.good{background:#eaf8f8;border-right:5px solid #0c96c5}.bad{background:#fff1f2;border-right:5px solid #d54b51}
.bar{height:11px;background:#e7eef9;border-radius:50px;overflow:hidden;margin:16px 0 30px}.bar div{height:100%;background:linear-gradient(90deg,#853283,#0c96c5);border-radius:50px;transition:width .3s}

.logo-frame:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#eff8fc;border:1px solid #d5eaf5;z-index:-1}
img.logo{display:block;max-width:none;width:410px;height:auto;flex-shrink:0;transform:scale(1.05)}
label{display:block;margin:14px 0;color:#34456c;line-height:1.9}
label:has(input[type=checkbox]){padding:14px;border:1px solid #e0eaf4;border-radius:12px;background:#f9fbff}

input[type=text]{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:12px;font:inherit}
ul{line-height:2;color:#34456c}
footer{text-align:center;padding:28px;color:#6d7c97;font-size:13px;position:relative}
@media(max-width:600px){header{padding:15px 20px}header b{font-size:16px}header span{font-size:12px}main{margin:24px auto;padding:0 13px}article{border-radius:20px;padding:28px 20px}.logo-frame{height:175px;width:200px}img.logo{width:370px}}
@media print{body{background:white}body:before,header,footer,button,.bar{display:none!important}main{margin:0;padding:0;max-width:none}article{box-shadow:none;border:0}article:before{display:none}}
</style><header><b>مدارس الأندلس الأهلية</b><span>برنامج رُقي وبناء | فرع الحمدانية (بنين)</span></header><main><article id="app"></article></main><footer>إنه يراني | قراري الرقمي — الاستقامة الرقمية</footer><script src="data.js"></script><script>
const q=SCENARIOS.map(s=>[s.situation,s.options.map(o=>o.text),s.options.findIndex(o=>o.score===2),s.options.map(o=>o.feedback)]);const pledges=COMMITMENTS;
let i=-1,score=0,choices=[],student="",chosen=[];const app=document.getElementById("app");function start(){i=0;score=0;choices=[];show()}function show(){let x=q[i];app.innerHTML='<small>الموقف '+(i+1)+' من '+q.length+' — '+SCENARIOS[i].title+'</small><div class="bar"><div style="width:'+((i+1)/q.length*100)+'%"></div></div><h2>'+x[0]+'</h2>'+x[1].map((a,j)=>'<button onclick="answer('+j+')">'+a+'</button>').join('')+'<div id="feedback"></div>'}function answer(j){let x=q[i];choices.push(j);score+=SCENARIOS[i].options[j].score;app.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML='<div class="'+(j===x[2]?'good':'bad')+'"><strong>'+(SCENARIOS[i].options[j].score===2?'قرار يعكس الاستقامة':'وقفة تربوية')+'</strong><p>'+x[3][j]+'</p></div><button class="primary" onclick="next()">'+(i===7?'عرض النتيجة':'الموقف التالي')+'</button>'}function next(){i++;if(i<q.length)show();else result()}function result(){let n=Math.round(score/16*10);app.innerHTML='<h1>مؤشر الاستقامة الرقمية</h1><h1>'+n+' / 10</h1><p>'+(n>=7?'قراراتك أظهرت وعيًا جيدًا بالاستقامة الرقمية. استمر في تطبيقها.':'كل موقف فرصة للتعلم. راجع اختياراتك وطبّق الاستقامة في مواقفك اليومية.')+'</p><h2>محاور الاستقامة الرقمية</h2><p>الرقابة الذاتية • الأمانة الرقمية • احترام الخصوصية • حقوق الآخرين</p><button class="primary" onclick="pledge()">انتقل إلى ميثاقي الرقمي</button>'}function pledge(){app.innerHTML='<h1>ميثاقي الرقمي</h1><p>اكتب اسمك إن رغبت، واختر ثلاثة التزامات على الأقل.</p><label>اسم الطالب (اختياري)<input id="student" type="text" placeholder="اسمك"></label>'+pledges.map((s,j)=>'<label><input type="checkbox" value="'+j+'"> '+s+'</label>').join('')+'<button class="primary" onclick="certificate()">إنشاء ميثاق الاستقامة الرقمية</button><p id="warn"></p>'}function certificate(){chosen=[...app.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);if(chosen.length<3){document.getElementById('warn').textContent='اختر ثلاثة التزامات على الأقل.';return}student=document.getElementById('student').value.trim();app.innerHTML='<div class="logo-frame"><img class="logo" src="assets/inna-yarani-original.svg" alt="إنه يراني"></div><h1>ميثاق <span style="color:#0c96c5">الاستقامة الرقمية</span></h1><p>أتعهد أمام نفسي بأن ألتزم بالسلوك الرقمي الصحيح حتى عندما لا يراقبني أحد.</p>'+(student?'<h2>'+escapeHTML(student)+'</h2>':'')+'<ul>'+chosen.map(j=>'<li style="margin:12px 0">'+pledges[j]+'</li>').join('')+'</ul><p>التاريخ: '+new Date().toLocaleDateString('ar-SA')+'</p><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button><button onclick="start()">إعادة التجربة</button>'}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}app.innerHTML='<div class="logo-frame"><img class="logo" src="assets/inna-yarani-original.svg" alt="إنه يراني"></div><h1>إنه يراني<br><span style="color:#0c96c5">قراري الرقمي</span></h1><p>الاستقامة تظهر عندما تختار الصحيح حتى عندما لا يراك أحد.</p><p>ثمانية مواقف رقمية واقعية تساعدك على التفكير في قراراتك.</p><button class="primary" onclick="start()">ابدأ التجربة</button>';
</script></html>

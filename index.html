<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنه يراني | قراري الرقمي</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#0f2771;background:#f4f7fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#dceefb 0,transparent 40%),radial-gradient(ellipse at 5% 95%,#f4e5f4 0,transparent 38%),#f5f8fc}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#0c96c5 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,black,transparent 28%,transparent 70%,black)}
header{background:#fff;border-bottom:4px solid #0c96c5;padding:17px max(5%,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 4px 20px #0f27710b;position:relative;z-index:1}
header b{font-size:19px;color:#0f2771}header span{font-size:14px;color:#004d9f}
header:before{content:"";height:5px;position:absolute;bottom:-4px;right:0;width:40%;background:linear-gradient(90deg,#d54b51,#853283,#32146d,#0c96c5);border-radius:0 0 0 12px}
main{max-width:850px;margin:42px auto 25px;padding:0 20px;position:relative;z-index:1}
article{background:white;border:1px solid #e5edf8;border-radius:28px;padding:clamp(24px,5vw,50px);box-shadow:0 22px 75px #0f277118;position:relative;overflow:hidden}
article:before{content:"";display:block;height:7px;background:linear-gradient(90deg,#d54b51,#853283,#32146d,#004d9f,#0c96c5);position:absolute;top:0;right:0;left:0}
h1{font-size:clamp(30px,4.2vw,45px);line-height:1.5;text-align:center;color:#0f2771;margin:12px 0 20px}
h2{font-size:clamp(21px,3vw,28px);line-height:1.9;color:#0f2771;margin:20px 0}
p{line-height:2;color:#475779;font-size:16px}
article>p{text-align:center}
button{display:block;width:100%;margin:14px 0;padding:18px 20px;border:2px solid #e3eaf5;border-radius:16px;background:#f9fbff;color:#0f2771;font:inherit;font-size:16px;cursor:pointer;text-align:right;transition:transform .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:#0c96c5;transform:translateY(-2px);box-shadow:0 8px 20px #0c96c51a}
button:focus-visible{outline:3px solid #0c96c5;outline-offset:3px}
button.primary{background:linear-gradient(110deg,#004d9f,#0f2771);border-color:transparent;color:white;text-align:center;font-weight:bold;box-shadow:0 9px 24px #004d9f30}
button:disabled{opacity:.7;cursor:default}
.good,.bad{padding:19px 22px;border-radius:16px;margin-top:20px;line-height:1.8}
.good{background:#eaf8f8;border-right:5px solid #0c96c5}.bad{background:#fff1f2;border-right:5px solid #d54b51}
.bar{height:11px;background:#e7eef9;border-radius:50px;overflow:hidden;margin:16px 0 30px}.bar div{height:100%;background:linear-gradient(90deg,#853283,#0c96c5);border-radius:50px;transition:width .3s}
small{font-size:14px;color:#004d9f;font-weight:bold}
.logo-frame{width:230px;height:205px;overflow:hidden;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;position:relative}
.logo-frame:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#eff8fc;border:1px solid #d5eaf5;z-index:-1}
img.logo{display:block;max-width:none;width:410px;height:auto;flex-shrink:0;transform:scale(1.05)}
label{display:block;margin:14px 0;color:#34456c;line-height:1.9}
label:has(input[type=checkbox]){padding:14px;border:1px solid #e0eaf4;border-radius:12px;background:#f9fbff}
input[type=checkbox]{accent-color:#004d9f;width:18px;height:18px;vertical-align:middle;margin-left:8px}
input[type=text]{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:12px;font:inherit}
ul{line-height:2;color:#34456c}
footer{text-align:center;padding:28px;color:#6d7c97;font-size:13px;position:relative}
@media(max-width:600px){header{padding:15px 20px}header b{font-size:16px}header span{font-size:12px}main{margin:24px auto;padding:0 13px}article{border-radius:20px;padding:28px 20px}.logo-frame{height:175px;width:200px}img.logo{width:370px}}
@media print{body{background:white}body:before,header,footer,button,.bar{display:none!important}main{margin:0;padding:0;max-width:none}article{box-shadow:none;border:0}article:before{display:none}}

.school-brand{display:flex;align-items:center;gap:14px;min-width:0}.school-logo{display:block;width:230px;max-width:45vw;height:auto;object-fit:contain}.school-brand-label{display:flex;flex-direction:column;gap:4px}.school-brand-label small{font-size:12px;color:#004d9f;font-weight:normal}@media(max-width:650px){header{gap:8px}.school-logo{width:150px}.school-brand-label b{font-size:13px}.school-brand-label small{font-size:10px}header>span{font-size:11px}}

.intro-kicker{display:inline-flex;align-items:center;gap:8px;border-radius:40px;padding:7px 16px;background:#eaf7fb;color:#006e9b;font-weight:700;font-size:13px;margin:0 auto 12px}
.intro{text-align:center}.verse{background:#f0f7fc;border:1px solid #d9eaf4;padding:18px;border-radius:18px;text-align:center;margin:20px 0;color:#0f2771;font-size:20px;line-height:2}.verse small{display:block;font-size:12px;color:#64748b}
.intro p{max-width:590px;margin:12px auto}.intro h1{margin:6px 0 14px}
.scene-head{display:flex;align-items:center;gap:15px}.scene-icon{font-size:31px;background:#edf8fc;border-radius:17px;width:65px;height:65px;display:grid;place-items:center}.scene-head h2{margin:0}.scene-text{background:#f7f9fe;border:1px solid #e8eef9;border-radius:17px;padding:18px 22px;margin:22px 0;white-space:pre-line;font-size:18px;line-height:2}
.option{display:flex;align-items:flex-start;gap:12px;line-height:1.8}.option .number{flex:none;background:#eaf2fa;border-radius:10px;min-width:32px;height:32px;display:grid;place-items:center;color:#004d9f;font-weight:bold}.option.chosen{border-color:#0c96c5;background:#eef8fc}
.feedback{border:1px solid #e0eaf4;background:#f7fbfe;border-radius:18px;padding:22px;margin-top:20px}.feedback h3{color:#0f2771;margin:0}.feedback p{margin:8px 0}.value-message{background:#effaf9;border-right:4px solid #0c96c5;border-radius:12px;padding:14px 18px;margin:18px 0;line-height:1.9;color:#125a68;font-weight:600}
.action-row{display:flex;gap:10px;flex-wrap:wrap}.action-row button{flex:1;min-width:160px}
.muted{color:#6c7b97;font-size:14px}.center{text-align:center}.centered-logo{display:block;width:150px;max-height:140px;object-fit:contain;margin:0 auto 12px}
.reflection-choice{display:flex;align-items:center;gap:12px}.reflection-choice span{font-size:20px}
.pledge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.pledge-item{margin:0!important;display:flex;align-items:flex-start;gap:9px;cursor:pointer}.pledge-item input{flex:none;margin-top:7px}.pledge-item.selected{border-color:#0c96c5!important;background:#eaf7fb!important}
.pledge-title{font-size:24px;margin:8px 0;text-align:center}.pledge-note{text-align:center}.progress-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#64748b}
.certificate{border:2px solid #0f2771;outline:5px solid #edf3fa;outline-offset:6px;border-radius:20px;padding:30px;margin:20px 0;text-align:center;background:linear-gradient(140deg,#fff,#f8fbff)}.certificate .school-logo{margin:0 auto 14px;width:230px;max-width:100%}.certificate h1{margin:4px 0}.certificate h2{color:#004d9f}.certificate ul{text-align:right;list-style:none;padding:0}.certificate li{padding:8px 0;border-bottom:1px solid #e8eef6}.certificate li:before{content:"✓";color:#0c96c5;margin-left:10px;font-weight:bold}
.cert-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #d9e5f3;padding-top:15px;margin-top:20px;font-size:13px;color:#475779}.participation{font-size:12px;color:#64748b}
@media(max-width:650px){.pledge-grid{grid-template-columns:1fr}.scene-text{font-size:16px}.certificate{padding:17px}.action-row{display:block}}
@media print{header,footer,.no-print,.action-row{display:none!important}.certificate{border:2px solid #0f2771;outline:0;margin:0;break-inside:avoid}article{padding:12px}body{background:white}}
</style><header><div class="school-brand"><img src="assets/alandalus-school-logo.svg" alt="شعار مدارس الأندلس الأهلية" class="school-logo"><div class="school-brand-label"><b>مدارس الأندلس الأهلية</b><small>فرع الحمدانية (بنين)</small></div></div><span>برنامج رُقي وبناء | الاستقامة الرقمية</span></header><main><article id="app"></article></main><footer>إنه يراني | قراري الرقمي — الاستقامة الرقمية</footer><script src="data.js"></script><script>
const app=document.getElementById("app");
let index=0,attempts=[],selected=-1,reflectionAnswer=-1,commitments=[],student="",finished=false;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logo='<img class="centered-logo" src="assets/inna-yarani-original.svg" alt="إنه يراني">';
const verse='<div class="verse">﴿أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَىٰ﴾<small>سورة العلق، الآية 14</small></div>';
function render(html){app.innerHTML=html;window.scrollTo({top:0,behavior:"smooth"})}
function home(){render('<div class="intro">'+logo+'<div class="intro-kicker">برنامج رُقي وبناء • الاستقامة الرقمية</div><h1>إنه يراني<br><span style="color:#0c96c5">قراري الرقمي</span></h1><p><strong>استقامتي تظهر في اختياراتي… حتى عندما لا يراني أحد</strong></p><h2>👀 ماذا لو لم يرك أحد؟</h2><p>تخيّل أنك أمام شاشة جهازك، ووجدت فرصة لفعل شيء لا ينبغي فعله.</p><p>لا يوجد معلم يراقبك، ولا أحد يعرف ماذا تفعل. <strong>هل سيتغير قرارك؟</strong></p><p>في هذه التجربة ستواجه مواقف قد تحدث لك في المدرسة أو المنزل أو أثناء استخدام الإنترنت.</p><p>ليس المطلوب أن تختار الإجابة التي تعتقد أننا نريدها، بل أن تفكر في القرار الذي ستتخذه فعلًا.</p>'+verse+'<p class="muted">12 موقفًا تفاعليًا • تأمل شخصي • ميثاق رقمي</p><button class="primary" onclick="start()">ابدأ التحدي ←</button></div>')}
function start(){index=0;attempts=[];selected=-1;reflectionAnswer=-1;commitments=[];student="";finished=false;show()}
function order(i){const base=[0,1,2];const shifts=[2,0,1,2,1,0,2,0,1,2,0,1];return base.map((_,j)=>base[(j+shifts[i])%3])}
function show(){selected=-1;const s=SCENARIOS[index],opts=order(index);render('<div class="progress-line"><strong>أكملت '+index+' من أصل '+SCENARIOS.length+' موقفًا</strong><span>الموقف '+(index+1)+' / '+SCENARIOS.length+'</span></div><div class="bar"><div style="width:'+(index/SCENARIOS.length*100)+'%"></div></div><div class="scene-head"><div class="scene-icon" aria-hidden="true">'+s.icon+'</div><div><small>🎯 الموقف '+(index+1)+'</small><h2>'+escapeHTML(s.title)+'</h2></div></div><div class="scene-text">'+escapeHTML(s.situation)+'</div><h3>❓ ماذا ستفعل؟</h3><div id="options">'+opts.map((j,k)=>'<button class="option" onclick="answer('+j+')"><span class="number">'+(k+1)+'</span><span>'+escapeHTML(s.options[j].text)+'</span></button>').join('')+'</div><div id="feedback" aria-live="polite"></div>')}
function answer(j){selected=j;const s=SCENARIOS[index],o=s.options[j];if(!attempts[index])attempts[index]=[];attempts[index].push(j);app.querySelectorAll("#options button").forEach(b=>{b.disabled=true;if(b.getAttribute("onclick")==="answer("+j+")")b.classList.add("chosen")});document.getElementById("feedback").innerHTML='<div class="feedback"><h3>💬 تأمل في قرارك</h3><p>'+escapeHTML(o.feedback)+'</p><div class="value-message">💚 '+escapeHTML(s.value)+'</div><div class="action-row"><button onclick="show()">جرّب قرارًا آخر</button><button class="primary" onclick="next()"> '+(index===5?'لحظة صدق':index===11?'انتقل إلى الميثاق':'الموقف التالي')+' ←</button></div></div>'}
function next(){if(selected<0)return;if(index===5){index=6;reflection();return}if(index===11){index=12;pledge();return}index++;show()}
function reflection(){render('<div class="intro">'+logo+'<div class="intro-kicker">منتصف الرحلة • 6 من 12</div><h1>💚 لحظة صدق</h1><p>قد تختار الإجابة الصحيحة هنا، لكن الاستقامة الحقيقية تظهر عندما تواجه الموقف في حياتك.</p><h2>هل سبق أن اتخذت قرارًا صحيحًا رغم أن أحدًا لم يكن يراقبك؟</h2><div id="reflection-options">'+["نعم، وأشعر بالفخر بقراري.","ربما، لكنني لم أفكر فيه بهذه الطريقة.","أريد أن أبدأ من اليوم."].map((v,j)=>'<button class="reflection-choice" onclick="chooseReflection('+j+')"><span>◯</span>'+v+'</button>').join('')+'</div><div id="reflection-feedback"></div><p class="muted">هذا السؤال للتأمل الشخصي، ولا توجد فيه إجابة صحيحة أو خاطئة.</p></div>')}
function chooseReflection(j){reflectionAnswer=j;document.querySelectorAll("#reflection-options button").forEach((b,k)=>{b.disabled=true;if(j===k)b.classList.add("chosen")});document.getElementById("reflection-feedback").innerHTML='<div class="value-message">كل قرار صحيح تتخذه في غياب الرقابة يقوّي استقامتك، ويجعلك أكثر صدقًا مع نفسك.</div><button class="primary" onclick="show()">أكمل رحلتي ←</button>'}
function pledge(){render('<div class="intro">'+logo+'<div class="intro-kicker">أكملت 12 من أصل 12 موقفًا</div><h1>🤝 ميثاقي الرقمي<br><span style="color:#0c96c5">إنه يراني</span></h1><p>بعد المواقف التي مررت بها، حان الوقت لتحدد المبادئ التي سترافقك في العالم الرقمي.</p><p><strong>اختر ثلاثة التزامات على الأقل:</strong></p></div><div class="pledge-grid">'+COMMITMENTS.map((v,j)=>'<label class="pledge-item"><input type="checkbox" value="'+j+'" onchange="updateCount()"><span>'+escapeHTML(v)+'</span></label>').join('')+'</div><p id="count" class="center muted">اخترت 0 من 10 التزامات</p><button id="pledge-btn" class="primary" onclick="adopt()" disabled>أتعهد أن أكون مستقيمًا في عالمي الرقمي</button><p id="warning" class="center muted" aria-live="polite">اختر ثلاثة التزامات على الأقل لاعتماد الميثاق.</p>')}
function updateCount(){const items=[...app.querySelectorAll('input[type=checkbox]')];const n=items.filter(x=>x.checked).length;items.forEach(x=>x.closest('label').classList.toggle('selected',x.checked));document.getElementById("count").textContent="اخترت "+n+" من 10 التزامات";document.getElementById("pledge-btn").disabled=n<3;document.getElementById("warning").textContent=n<3?"اختر ثلاثة التزامات على الأقل لاعتماد الميثاق.":"الميثاق جاهز للاعتماد."}
function adopt(){commitments=[...app.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);if(commitments.length<3)return;finished=true;closing()}
function closing(){render('<div class="intro">'+logo+'<div class="intro-kicker">أكملت التجربة واعتمدت ميثاقك</div><h1>🌟 انتهت التجربة…<br><span style="color:#0c96c5">وبدأ التحدي الحقيقي!</span></h1><p>أمامك كل يوم قرارات كثيرة تتخذها خلف الشاشة.</p><p>قد لا يراك معلمك، ولا والداك، ولا أصدقاؤك.</p><h2>لكن الله يراك.</h2>'+verse+'<p>اجعل استقامتك واحدة، في حضور الناس وغيابهم.</p><div class="value-message">«إنه يراني… ليست عبارة أرددها، بل قيمة أعيشها، وقرار أتخذه.»</div><button class="primary" onclick="nameStep()">قراري أن أكون مستقيمًا ←</button></div>')}
function nameStep(){render('<div class="intro">'+logo+'<div class="intro-kicker">بطاقة مشاركة والتزام</div><h1>🏅 سفير الاستقامة الرقمية</h1><p>أكملت المواقف الاثني عشر واعتمدت ميثاقك الرقمي.</p><p>يمكنك إصدار بطاقة تذكارية تتضمن الالتزامات التي اخترتها.</p></div><label for="student">اسم الطالب (اختياري)<input id="student" type="text" maxlength="70" autocomplete="off" placeholder="اكتب اسمك إن رغبت"></label><p class="muted">لا يُرسل الاسم أو اختياراتك إلى خادم. البطاقة تُنشأ داخل متصفحك فقط.</p><button class="primary" onclick="certificate()">عرض بطاقة سفير الاستقامة الرقمية</button>')}
function certificate(){student=document.getElementById("student")?.value.trim()||student;const date=new Date().toLocaleDateString("ar-SA");render('<div class="certificate" id="printable"><img class="school-logo" src="assets/alandalus-school-logo.svg" alt="شعار مدارس الأندلس الأهلية">'+logo+'<div class="intro-kicker">برنامج رُقي وبناء • فرع الحمدانية (بنين)</div><h1>🏅 سفير الاستقامة الرقمية</h1><p>بطاقة مشاركة والتزام</p>'+(student?'<h2>'+escapeHTML(student)+'</h2>':'')+'<p>أتممت تجربة «إنه يراني | قراري الرقمي» المكوّنة من 12 موقفًا تفاعليًا، واخترت الالتزامات التالية لميثاقي الرقمي:</p><ul>'+commitments.map(j=>'<li>'+escapeHTML(COMMITMENTS[j])+'</li>').join('')+'</ul><div class="cert-meta"><span>التاريخ: '+date+'</span><span>مدارس الأندلس الأهلية – الحمدانية</span></div><p class="participation">هذه بطاقة مشاركة والتزام، وليست تقييمًا لأخلاق الطالب أو سلوكه.</p></div><div class="action-row no-print"><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button><button onclick="start()">إعادة التجربة</button></div>')}
home();
</script></html>

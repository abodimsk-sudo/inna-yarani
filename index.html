<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنه يراني | قراري الرقمي</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#0f2771;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:3px solid #0c96c5;padding:18px 6%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{max-width:790px;margin:40px auto;padding:22px}article{background:white;border-radius:22px;padding:32px;box-shadow:0 12px 32px #0f277115}h1{font-size:clamp(28px,5vw,46px)}h2{line-height:1.7}p{line-height:1.9;color:#34456c}.button,button{display:block;width:100%;margin:12px 0;padding:16px;border:1px solid #d5e0ef;border-radius:14px;background:white;color:#0f2771;font:inherit;cursor:pointer;text-align:right}button.primary{background:#004d9f;color:white;text-align:center;font-weight:bold}button:hover{border-color:#0c96c5}button:disabled{opacity:.7;cursor:default}.good{background:#e8f6f7;border-right:5px solid #0c96c5;padding:16px;border-radius:12px;margin-top:16px}.bad{background:#fff1f1;border-right:5px solid #d54b51;padding:16px;border-radius:12px;margin-top:16px}.hidden{display:none}.bar{height:10px;background:#e4eaf5;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#0c96c5}small{color:#65718b}img.logo{display:block;width:min(270px,80%);height:auto;margin:12px auto 24px}label{display:block;margin:12px 0}input[type=text]{width:100%;padding:13px;border:1px solid #cbd7e8;border-radius:10px;font:inherit}footer{text-align:center;padding:25px;color:#667}@media print{header,footer,button,.bar{display:none!important}main{margin:0;padding:0}article{box-shadow:none}}</style><header><b>مدارس الأندلس الأهلية</b><span>برنامج رُقي وبناء — فرع الحمدانية (بنين)</span></header><main><article id="app"></article></main><footer>إنه يراني | قراري الرقمي — الاستقامة الرقمية</footer><script src="data.js"></script><script>
const q=SCENARIOS.map(s=>[s.situation,s.options.map(o=>o.text),s.options.findIndex(o=>o.score===2),s.options.map(o=>o.feedback)]);const pledges=COMMITMENTS;
let i=-1,score=0,choices=[],student="",chosen=[];const app=document.getElementById("app");function start(){i=0;score=0;choices=[];show()}function show(){let x=q[i];app.innerHTML='<small>الموقف '+(i+1)+' من '+q.length+' — '+SCENARIOS[i].title+'</small><div class="bar"><div style="width:'+((i+1)/q.length*100)+'%"></div></div><h2>'+x[0]+'</h2>'+x[1].map((a,j)=>'<button onclick="answer('+j+')">'+a+'</button>').join('')+'<div id="feedback"></div>'}function answer(j){let x=q[i];choices.push(j);score+=SCENARIOS[i].options[j].score;app.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML='<div class="'+(j===x[2]?'good':'bad')+'"><strong>'+(SCENARIOS[i].options[j].score===2?'قرار يعكس الاستقامة':'وقفة تربوية')+'</strong><p>'+x[3][j]+'</p></div><button class="primary" onclick="next()">'+(i===7?'عرض النتيجة':'الموقف التالي')+'</button>'}function next(){i++;if(i<q.length)show();else result()}function result(){let n=Math.round(score/16*10);app.innerHTML='<h1>مؤشر الاستقامة الرقمية</h1><h1>'+n+' / 10</h1><p>'+(n>=7?'قراراتك أظهرت وعيًا جيدًا بالاستقامة الرقمية. استمر في تطبيقها.':'كل موقف فرصة للتعلم. راجع اختياراتك وطبّق الاستقامة في مواقفك اليومية.')+'</p><h2>محاور الاستقامة الرقمية</h2><p>الرقابة الذاتية • الأمانة الرقمية • احترام الخصوصية • حقوق الآخرين</p><button class="primary" onclick="pledge()">انتقل إلى ميثاقي الرقمي</button>'}function pledge(){app.innerHTML='<h1>ميثاقي الرقمي</h1><p>اكتب اسمك إن رغبت، واختر ثلاثة التزامات على الأقل.</p><label>اسم الطالب (اختياري)<input id="student" type="text" placeholder="اسمك"></label>'+pledges.map((s,j)=>'<label><input type="checkbox" value="'+j+'"> '+s+'</label>').join('')+'<button class="primary" onclick="certificate()">إنشاء ميثاق الاستقامة الرقمية</button><p id="warn"></p>'}function certificate(){chosen=[...app.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);if(chosen.length<3){document.getElementById('warn').textContent='اختر ثلاثة التزامات على الأقل.';return}student=document.getElementById('student').value.trim();app.innerHTML='<img class="logo" src="assets/inna-yarani-original.svg" alt="إنه يراني" onerror="this.style.display=\'none\'"><h1>ميثاق الاستقامة الرقمية</h1><p>أتعهد أمام نفسي بأن ألتزم بالسلوك الرقمي الصحيح حتى عندما لا يراقبني أحد.</p>'+(student?'<h2>'+escapeHTML(student)+'</h2>':'')+'<ul>'+chosen.map(j=>'<li style="margin:12px 0">'+pledges[j]+'</li>').join('')+'</ul><p>التاريخ: '+new Date().toLocaleDateString('ar-SA')+'</p><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button><button onclick="start()">إعادة التجربة</button>'}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}app.innerHTML='<img class="logo" src="assets/inna-yarani-original.svg" alt="إنه يراني" onerror="this.style.display=\'none\'"><h1>إنه يراني | قراري الرقمي</h1><p>الاستقامة تظهر عندما تختار الصحيح حتى عندما لا يراك أحد.</p><p>ثمانية مواقف رقمية واقعية تساعدك على التفكير في قراراتك.</p><button class="primary" onclick="start()">ابدأ التجربة</button>';
</script></html>
